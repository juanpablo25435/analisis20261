[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-core"
version = "0.1.0"
description = "Shared core and quality tooling for the analisis20261 repository."
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.5",
    "numpy>=1.26.4",
    "pyemd>=1.1.0",
    "pyinstrument>=5.1.2",
    "pytest>=8.0",
    "pyttsx3>=2.98",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["QNodes"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["shared_core"]
